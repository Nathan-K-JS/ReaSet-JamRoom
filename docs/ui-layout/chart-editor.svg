<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Proposed chart editor and phone timing review</title>
  <desc id="description">Static design proposal. Desktop shows plain text with recognized chords in green beside a performance preview. Section dividers show song-relative time, time since the previous section, and timing evidence. A reserved waveform and action area stays below the scrolling chart. Phone has separate Edit, Preview and Timing views with reachable Save and Stop actions. All sample words are original.</desc>
  <defs>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#eaf0f4}
      .bold{font-weight:600}.muted{fill:#9dafbc}.green{fill:#74ddb0}.amber{fill:#e2bb79}
      .mono{font-family:Consolas,Menlo,monospace}.small{font-size:13px}.body{font-size:16px}
      .button{font-size:14px;font-weight:600}.ink{fill:#10271e}
    </style>
    <pattern id="wave" width="76" height="74" patternUnits="userSpaceOnUse">
      <path d="M3 31V43 M9 24V50 M15 18V56 M21 29V45 M27 11V63 M33 22V52 M39 29V45 M45 17V57 M51 26V48 M57 32V42 M63 20V54 M69 29V45" fill="none" stroke="#466c5c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#101419"/>
  <text x="24" y="34" font-size="15" class="green bold">PROPOSED / CHART AUTHORING + TIMING REVIEW</text>
  <text x="24" y="60" font-size="14" class="muted">One workspace for library corrections and import review. Original sample text; static design, not application screens.</text>

  <!-- Desktop workspace: chart content scrolls between reserved header and transport. -->
  <rect x="20" y="88" width="1170" height="842" rx="16" fill="#141a20" stroke="#34414b"/>
  <text x="44" y="126" font-size="24" class="bold">Edit chart</text>
  <text x="188" y="126" font-size="20">Room sketch</text>
  <rect x="826" y="105" width="183" height="42" rx="8" fill="#28343e"/>
  <text x="843" y="131" class="button">Change source chart</text>
  <rect x="1021" y="105" width="145" height="42" rx="8" fill="#28343e"/>
  <text x="1041" y="131" class="button">Previous version</text>
  <text x="44" y="163" class="body muted">Library song · Editing in original key C · Source: manually authored</text>
  <text x="953" y="163" class="body amber">Unsaved changes</text>
  <path d="M20 183H1190" stroke="#34414b"/>
  <text x="44" y="217" class="body bold">Write chords and words</text>
  <text x="651" y="217" class="body bold">Performance preview</text>
  <rect x="923" y="194" width="243" height="36" rx="7" fill="#28343e"/>
  <text x="939" y="218" class="small">Original key C · Display capo off</text>

  <!-- Plain-text authoring pane. -->
  <rect x="44" y="245" width="582" height="396" rx="10" fill="#10161c" stroke="#34414b"/>
  <rect x="44" y="245" width="582" height="56" rx="10" fill="#202c35"/>
  <text x="60" y="278" font-size="23" class="muted">⠿</text>
  <text x="88" y="276" class="body bold">Verse</text>
  <text x="176" y="276" class="small">0:00.0</text>
  <text x="280" y="276" class="small muted">Matched from lyrics · check playback</text>
  <text x="65" y="333" class="small muted">1</text>
  <text x="94" y="335" font-size="20" class="mono green" xml:space="preserve">C              Am7</text>
  <text x="65" y="364" class="small muted">2</text>
  <text x="94" y="366" font-size="20" class="mono">We find a way together</text>
  <text x="65" y="405" class="small muted">3</text>
  <text x="94" y="407" font-size="20" class="mono green" xml:space="preserve">F        G/B</text>
  <text x="65" y="436" class="small muted">4</text>
  <text x="94" y="438" font-size="20" class="mono">Home before the light</text>

  <rect x="44" y="460" width="582" height="62" fill="#293229" stroke="#8f794d"/>
  <text x="60" y="492" font-size="23" class="amber">⠿</text>
  <text x="88" y="484" class="body bold">Instrumental</text>
  <text x="88" y="507" class="small">0:18.6 · +18.6s from previous start</text>
  <text x="398" y="484" class="small amber">Estimated</text>
  <text x="398" y="507" class="small muted">Check timing in playback</text>
  <text x="65" y="557" class="small muted">5</text>
  <text x="94" y="559" font-size="20" class="mono" xml:space="preserve">| <tspan class="green">Am7</tspan> | <tspan class="green">F</tspan> | <tspan class="green">C</tspan> | <tspan class="green">G</tspan> | x2</text>
  <path d="M430 542V565" stroke="#eaf0f4" stroke-width="2"/>
  <rect x="62" y="588" width="184" height="35" rx="6" fill="#28343e"/>
  <text x="76" y="611" class="small">Line type: Auto → Chords</text>
  <text x="264" y="611" class="small green">Green = recognized chord</text>
  <rect x="615" y="309" width="5" height="143" rx="3" fill="#45535d"/>

  <!-- Preview shares the same source; no separate editable lyric document. -->
  <rect x="650" y="245" width="516" height="396" rx="10" fill="#18221f" stroke="#3a5648"/>
  <text x="674" y="278" font-size="19" class="bold">Verse</text>
  <text x="1048" y="278" class="small muted">Page 1 of 1</text>
  <text x="683" y="333" font-size="21" class="mono green" xml:space="preserve">C              Am7</text>
  <text x="683" y="364" font-size="21" class="mono">We find a way together</text>
  <text x="683" y="409" font-size="21" class="mono green" xml:space="preserve">F        G/B</text>
  <text x="683" y="440" font-size="21" class="mono">Home before the light</text>
  <path d="M674 466H1142" stroke="#3a5648"/>
  <text x="674" y="492" class="small muted">NEXT SECTION</text>
  <text x="674" y="520" font-size="19" class="bold">Instrumental</text>
  <text x="683" y="559" font-size="21" class="mono" xml:space="preserve">| <tspan class="green">Am7</tspan> | <tspan class="green">F</tspan> | <tspan class="green">C</tspan> | <tspan class="green">G</tspan> | x2</text>
  <text x="674" y="611" class="small muted">Same corrected words in Lyrics and Chords.</text>

  <!-- Reserved timing area: labels above handles; waveform below. -->
  <path d="M20 658H1190" stroke="#34414b"/>
  <text x="44" y="687" class="body bold">Song timing</text>
  <text x="160" y="687" class="small muted">Drag a handle to move time. Drag a text divider to move content.</text>
  <text x="990" y="687" class="small">0:17.2 / 2:36.0</text>
  <rect x="44" y="702" width="1122" height="103" rx="7" fill="#10161c"/>
  <text x="56" y="723" class="small muted">Verse · 0:00</text>
  <text x="391" y="723" class="small amber">Instrumental · 0:18.6</text>
  <text x="823" y="723" class="small muted">Chorus · 0:34.0</text>
  <g transform="translate(56 728)"><rect width="1098" height="66" fill="url(#wave)"/></g>
  <path d="M62 730V795 M847 730V795" stroke="#729185" stroke-width="2"/>
  <path d="M466 730V795" stroke="#e2bb79" stroke-width="3"/>
  <rect x="457" y="729" width="18" height="19" rx="4" fill="#e2bb79"/>
  <path d="M436 735V798" stroke="#eaf0f4" stroke-width="2"/>
  <path d="M430 734H442L436 742Z" fill="#eaf0f4"/>
  <text x="1113" y="790" class="small muted">Zoom +</text>

  <!-- Footer is reserved layout space, never overlaid on chart content. -->
  <path d="M20 819H1190" stroke="#34414b"/>
  <rect x="44" y="835" width="74" height="44" rx="8" fill="#28343e"/>
  <text x="65" y="863" class="button">Play</text>
  <rect x="128" y="835" width="74" height="44" rx="8" fill="#512c32" stroke="#a25d63"/>
  <text x="148" y="863" class="button">Stop</text>
  <rect x="214" y="835" width="145" height="44" rx="8" fill="#28343e"/>
  <text x="230" y="863" class="button">Play before cue</text>
  <rect x="371" y="835" width="120" height="44" rx="8" fill="#28343e"/>
  <text x="390" y="863" class="button">Starts here</text>
  <rect x="503" y="835" width="141" height="44" rx="8" fill="#28343e"/>
  <text x="521" y="863" class="button">Mark checked</text>
  <rect x="932" y="835" width="90" height="44" rx="8" fill="#28343e"/>
  <text x="951" y="863" class="button">Return</text>
  <rect x="1034" y="835" width="132" height="44" rx="8" fill="#74ddb0"/>
  <text x="1060" y="863" class="button ink">Save chart</text>
  <text x="44" y="908" class="small muted">Save applies to this song in REAPER. Import review instead confirms “Saved for import”.</text>

  <!-- Phone Timing view: one content pane, no stacked desktop panels. -->
  <rect x="1218" y="88" width="362" height="740" rx="23" fill="#141a20" stroke="#45535d" stroke-width="2"/>
  <text x="1238" y="127" font-size="22" class="bold">Room sketch</text>
  <text x="1238" y="155" class="small amber">Chart draft · changes not yet saved</text>
  <rect x="1236" y="175" width="102" height="42" rx="7" fill="#28343e"/>
  <text x="1273" y="202" class="button">Edit</text>
  <rect x="1345" y="175" width="102" height="42" rx="7" fill="#28343e"/>
  <text x="1369" y="202" class="button">Preview</text>
  <rect x="1454" y="175" width="108" height="42" rx="7" fill="#74ddb0"/>
  <text x="1484" y="202" class="button ink">Timing</text>
  <text x="1238" y="251" class="small muted">SELECTED SECTION</text>
  <rect x="1236" y="265" width="326" height="45" rx="7" fill="#28343e"/>
  <text x="1251" y="294" class="body bold">Instrumental</text>
  <text x="1532" y="294" class="body muted">⌄</text>
  <text x="1238" y="337" class="small amber">Manually placed · check playback</text>
  <text x="1238" y="372" class="small muted">START IN SONG</text>
  <rect x="1236" y="384" width="145" height="46" rx="7" fill="#10161c" stroke="#45535d"/>
  <text x="1251" y="415" font-size="22" class="mono">0:18.6</text>
  <text x="1400" y="405" class="body">+18.6 seconds</text>
  <text x="1400" y="426" class="small muted">from previous start</text>
  <rect x="1236" y="450" width="326" height="108" rx="7" fill="#10161c"/>
  <g transform="translate(1248 467)"><rect width="302" height="66" fill="url(#wave)"/></g>
  <text x="1248" y="547" class="small muted">0:12</text>
  <text x="1516" y="547" class="small muted">0:24</text>
  <path d="M1405 465V550" stroke="#e2bb79" stroke-width="3"/>
  <rect x="1394" y="460" width="22" height="23" rx="5" fill="#e2bb79"/>
  <path d="M1380 480V550" stroke="#eaf0f4" stroke-width="2"/>
  <rect x="1236" y="574" width="326" height="44" rx="7" fill="#28343e"/>
  <text x="1335" y="602" class="button">Play before cue</text>
  <rect x="1236" y="630" width="157" height="44" rx="7" fill="#28343e"/>
  <text x="1276" y="658" class="button">Starts here</text>
  <rect x="1405" y="630" width="157" height="44" rx="7" fill="#28343e"/>
  <text x="1434" y="658" class="button">Mark checked</text>
  <text x="1238" y="702" class="small muted">Drag a handle or enter the start time.</text>
  <path d="M1218 718H1580" stroke="#34414b"/>
  <rect x="1236" y="733" width="71" height="46" rx="7" fill="#28343e"/>
  <text x="1258" y="762" class="button">Play</text>
  <rect x="1317" y="733" width="71" height="46" rx="7" fill="#512c32" stroke="#a25d63"/>
  <text x="1337" y="762" class="button">Stop</text>
  <rect x="1400" y="733" width="162" height="46" rx="7" fill="#74ddb0"/>
  <text x="1447" y="762" class="button ink">Save chart</text>
  <text x="1310" y="807" class="small muted">Return to song review</text>
  <text x="1230" y="862" class="body bold">Phone: one task at a time</text>
  <text x="1230" y="890" class="small muted">Edit text, inspect Preview, then check Timing.</text>
  <text x="1230" y="913" class="small muted">Save and Stop have reserved space.</text>

  <text x="24" y="970" class="small muted">PROPOSED · Text recognition confirms notation only. Automatic timing stays unverified until checked against playback.</text>
</svg>
