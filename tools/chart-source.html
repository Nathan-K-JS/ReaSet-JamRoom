<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review source chart</title><style>body{background:#111a24;color:#edf3fa;font:16px system-ui;max-width:800px;margin:auto;padding:24px}input,button{font:inherit;padding:12px;background:#26384b;color:inherit;border:1px solid #567;border-radius:8px;margin:4px;max-width:100%;box-sizing:border-box}input{width:100%}#results button{display:block;text-align:left;width:100%}</style></head><body><h1>Choose a chart</h1><p>Your current chart stays unchanged until you choose Use this chart in the preview.</p><input id="query" aria-label="Search Ultimate Guitar" placeholder="Artist and song"><button id="search">Search Ultimate Guitar</button><div id="results"></div><input id="url" aria-label="Ultimate Guitar URL" placeholder="https://tabs.ultimate-guitar.com/tab/…"><button id="preview">Preview link</button><p id="status" role="status"></p><script src="/chart-pagination.js"></script><script src="/chart-author.js"></script><script>
const q=new URLSearchParams(location.search),$=id=>document.getElementById(id);$('query').value=q.get('name')||'';
async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),v=await r.json();if(!r.ok||v.error)throw Error(v.error||'Request failed');return v;}
async function preview(url){$('status').textContent='Fetching chart and matching section times…';try{const r=await post('/api/chart-source',{name:q.get('name'),url}),d=r.document;ChartAuthor.open({title:'Source preview · '+q.get('name'),document:d,duration:d.duration,save:async doc=>{if(!window.opener)throw Error('The original editor is closed. Reopen source selection from the editor.');const origin=q.get('origin');if(!origin||new URL(origin).hostname!==location.hostname)throw Error('Invalid editor origin');window.opener.postMessage({type:'chart-source',token:q.get('token'),document:doc},origin);window.close();},savedMessage:'Source sent to your chart draft.'});document.querySelector('.ca-save').textContent='Use this chart';ChartAuthor.audition(ChartAuthor.active,{name:q.get('name')});$('status').textContent='Preview ready. Closing the preview keeps your current chart.';}catch(e){$('status').textContent=e.message;}}
$('preview').onclick=()=>preview($('url').value.trim());$('search').onclick=async()=>{$('status').textContent='Searching…';try{const r=await post('/api/ug_search',{free:$('query').value,artist:'',title:''});$('results').replaceChildren();for(const s of r.charts||[]){const b=document.createElement('button');b.textContent=s.title||s.url;b.onclick=()=>preview(s.url);$('results').appendChild(b);}$('status').textContent='Choose a result to preview.';}catch(e){$('status').textContent=e.message;}};
</script></body></html>
